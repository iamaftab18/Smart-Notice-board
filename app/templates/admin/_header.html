<header class="bg-white border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="h-10 w-10 rounded-xl bg-brand-600 flex items-center justify-center shadow-lg shadow-brand-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6a1 1 0 011 1v1h2a1 1 0 011 1v13a2 2 0 01-2 2H7a2 2 0 01-2-2V6a1 1 0 011-1h2V4a1 1 0 011-1z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v3h6V3M9 11h6M9 15h6M9 19h3" />
        </svg>
      </div>
      <div>
        <h1 class="font-display font-bold text-lg text-slate-900 leading-tight">Notice Board Admin</h1>
        <p class="text-xs text-slate-500 leading-tight">Manage what students see on the display</p>
      </div>
    </div>

    <div class="flex items-center gap-4">
      <nav class="hidden sm:flex items-center gap-4">
        <a href="{{ url_for('admin.dashboard') }}"
           class="text-sm font-medium transition {{ 'text-brand-700' if active_page == 'dashboard' else 'text-slate-600 hover:text-brand-700' }}">
          Notices
        </a>
        <a href="{{ url_for('admin.students_page') }}"
           class="text-sm font-medium transition {{ 'text-brand-700' if active_page == 'students' else 'text-slate-600 hover:text-brand-700' }}">
          Students
        </a>
      </nav>
      <a href="{{ url_for('board.notice_board') }}" target="_blank"
         class="hidden sm:inline-flex items-center gap-1.5 text-sm font-medium text-slate-600 hover:text-brand-700 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
        </svg>
        View live board
      </a>
      <div class="h-8 w-px bg-slate-200 hidden sm:block"></div>
      <div class="text-right hidden sm:block">
        <p class="text-sm font-semibold text-slate-800 leading-tight">{{ current_user.name }}</p>
        <p class="text-xs text-slate-500 leading-tight">{{ current_user.email }}</p>
      </div>
      <form method="POST" action="{{ url_for('auth.logout') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit"
                class="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-red-600 hover:border-red-200 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V6a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          Sign out
        </button>
      </form>
    </div>
  </div>
</header>
