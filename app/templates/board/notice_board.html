<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Notice Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui'],
          display: ['Poppins', 'ui-sans-serif', 'system-ui'],
        },
        colors: {
          brand: {
            50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
            400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8',
            800: '#1e40af', 900: '#1e3a8a', 950: '#172554',
          },
        },
      },
    },
  }
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
  html, body { height: 100%; margin: 0; }
</style>
</head>
<body class="h-full font-sans antialiased kiosk bg-slate-950 text-white">

<div id="board-root" class="h-full w-full relative flex flex-col overflow-hidden bg-gradient-to-br from-brand-900 via-brand-950 to-slate-950 transition-colors duration-700">

  <!-- Header -->
  <header class="flex items-center justify-between px-10 sm:px-16 py-8 shrink-0">
    <div class="flex items-center gap-4">
      <div class="h-14 w-14 rounded-2xl bg-white/10 backdrop-blur flex items-center justify-center ring-1 ring-white/20">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 3h6a1 1 0 011 1v1h2a1 1 0 011 1v13a2 2 0 01-2 2H7a2 2 0 01-2-2V6a1 1 0 011-1h2V4a1 1 0 011-1z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 3v3h6V3M9 11h6M9 15h6M9 19h3" />
        </svg>
      </div>
      <div>
        <p class="font-display font-extrabold text-2xl sm:text-3xl tracking-tight">College Notice Board</p>
        <p id="board-date" class="text-brand-200/80 text-base sm:text-lg font-medium"></p>
      </div>
    </div>
    <div class="text-right">
      <p id="board-clock" class="font-display font-bold text-4xl sm:text-5xl tabular-nums tracking-tight"></p>
    </div>
  </header>

  <!-- Main notice area -->
  <main id="notice-area" class="flex-1 flex items-center justify-center px-10 sm:px-20 pb-10 min-h-0">
    <!-- populated by JS -->
  </main>

  <!-- Footer: rotation dots -->
  <footer class="shrink-0 flex items-center justify-center gap-2 pb-8" id="board-dots"></footer>
</div>

<script>
  window.BOARD_CONFIG = {
    pollSeconds: {{ poll_seconds }},
    rotateSeconds: {{ rotate_seconds }},
    apiUrl: "{{ url_for('board.board_data') }}"
  };
</script>
<script src="{{ url_for('static', filename='js/board.js') }}"></script>
</body>
</html>
